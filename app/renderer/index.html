<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self';">
  <title>DS鲸鱼娘 桌宠</title>
  <link rel="stylesheet" href="pet://local/renderer/style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 触发动作时的小气泡 -->
  <div id="bubble" class="hidden"><span id="bubble-text"></span></div>

  <!-- 首次运行提示 -->
  <div id="hint" class="hidden">
    <b>你好呀，我是 DS鲸鱼娘 🐋</b>
    <span>拖动我换位置 · 左键摸摸头 · 右键打开菜单 · 双击收起表情和动作</span>
    <span>你打字、点鼠标、滚页面，我都会跟着动 —— 试试快速敲一串字</span>
    <span>「💬 和她聊天」可以接自己的大模型 API 跟我说话</span>
    <span class="dim">Ctrl+Alt+L 聊天 ｜ 模型作者：B站 @氵六青</span>
  </div>

  <!-- ============ 面板区（贴着宠物，目前只有一个聊天面板） ============ -->
  <div id="panels">

    <!-- 聊天面板 -->
    <div id="chat" class="card hidden">
      <div class="p-head">
        <span class="p-emoji">💬</span>
        <div class="p-title">
          <div class="c-title">和她聊天</div>
          <div class="p-sub" id="c-sub">未配置接口</div>
        </div>
        <button id="c-close" title="关闭面板">×</button>
      </div>

      <!-- 首次配置 -->
      <div id="c-setup">
        <label class="c-field">接口地址
          <input id="c-base" spellcheck="false" placeholder="https://api.deepseek.com/v1">
        </label>
        <label class="c-field">模型名
          <input id="c-model" spellcheck="false" placeholder="deepseek-chat">
        </label>
        <label class="c-field">API Key<span id="c-key-hint" class="c-dim"></span>
          <input id="c-key" type="password" spellcheck="false" autocomplete="off" placeholder="sk-...">
        </label>
        <label class="c-field">补充人设（可选）
          <textarea id="c-extra" rows="2" spellcheck="false" placeholder="例如：说话再随便一点，多用颜文字"></textarea>
        </label>
        <div class="c-row">
          <button id="c-save" class="primary">保存并开始</button>
          <button id="c-test">测试连接</button>
        </div>
        <div class="c-msg" id="c-setup-msg"></div>
        <div class="c-dim c-tip">
          支持任何 OpenAI 兼容接口：DeepSeek / OpenAI / Moonshot / 智谱 / Ollama / LM Studio / one-api。<br>
          密钥只存在本机 <code>%APPDATA%\DSWhalePet\chat.json</code>，不会上传。
        </div>
      </div>

      <!-- 对话 -->
      <div id="c-main" class="hidden">
        <ul class="c-msgs" id="c-msgs"></ul>
        <div class="c-thinking hidden" id="c-thinking"><i></i><i></i><i></i> 她正在想…</div>
        <div class="c-input">
          <textarea id="c-text" rows="1" spellcheck="false" placeholder="和她说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="c-send" title="发送">发送</button>
        </div>
        <div class="c-foot">
          <button id="c-clear">清空对话</button>
          <button id="c-settings">接口设置</button>
        </div>
        <div class="c-msg" id="c-msg"></div>
      </div>
    </div>

  </div>

  <noscript>需要启用 JavaScript</noscript>

  <script src="pet://local/vendor/live2dcubismcore.min.js"></script>
  <script src="pet://local/vendor/pixi.min.js"></script>
  <script src="pet://local/vendor/pixi-live2d-display.cubism4.min.js"></script>
  <script src="pet://local/renderer/pet.js"></script>
  <script src="pet://local/renderer/chat.js"></script>
</body>
</html>
